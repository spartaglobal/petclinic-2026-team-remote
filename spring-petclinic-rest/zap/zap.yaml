env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - http://localhost:9966/petclinic/v3/api-docs
    - http://localhost:9966/
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- alertFilters:
  - newRisk: False Positive
    ruleId: '10027'
    url: .*/swagger-ui/.*
    urlRegex: true
  - newRisk: False Positive
    ruleId: '10110'
    url: .*/swagger-ui/.*
    urlRegex: true
  type: alertFilter
- parameters:
    maxDuration: 2
    url: http://localhost:9966/
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
