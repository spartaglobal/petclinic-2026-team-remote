# OWASP ZAP baseline rules for spring-petclinic-rest
#
# Used by zap-baseline.py via `-c zap-baseline.conf`
# Format (tab separated):  <rule id>	<IGNORE|INFO|WARN|FAIL|OUTOFSCOPE>	<name or URL regex>
# Rules not listed here default to WARN.
#
# Policy: FAIL on information disclosure, WARN on hardening gaps, IGNORE rules
# that don't apply to a stateless JSON API served over plain HTTP in dev.
# Promote a WARN to FAIL once it has been fixed so it can't regress.

# --- Fail the build ------------------------------------------------------------
10003	FAIL	(Vulnerable JS Library)
10023	FAIL	(Information Disclosure - Debug Error Messages)
10024	FAIL	(Information Disclosure - Sensitive Information in URL)
10037	FAIL	(Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s))
10056	FAIL	(X-Debug-Token Information Leak)
10062	FAIL	(PII Disclosure)
90022	FAIL	(Application Error Disclosure)

# --- Warn (hardening) ----------------------------------------------------------
10020	WARN	(Missing Anti-clickjacking Header)
10021	WARN	(X-Content-Type-Options Header Missing)
10036	WARN	(Server Leaks Version Information via "Server" HTTP Response Header Field)
10038	WARN	(Content Security Policy (CSP) Header Not Set)
10063	WARN	(Permissions Policy Header Not Set)
10098	WARN	(Cross-Domain Misconfiguration)
90004	WARN	(Insufficient Site Isolation Against Spectre Vulnerability)

# --- Ignore (not applicable) ---------------------------------------------------
# Plain HTTP on localhost; enforce HSTS at the TLS-terminating proxy instead.
10035	IGNORE	(Strict-Transport-Security Header)
# Stateless JSON API with CSRF deliberately disabled; there are no HTML forms.
10202	IGNORE	(Absence of Anti-CSRF Tokens)
# JSON dates and numeric IDs trip this constantly.
10096	IGNORE	(Timestamp Disclosure - Unix)
# Informational only.
10049	IGNORE	(Storable and Cacheable Content)
10109	IGNORE	(Modern Web Application)

# --- Out of scope for specific URLs --------------------------------------------
# Third-party Swagger UI bundle: comments and eval-like calls aren't our code.
10027	OUTOFSCOPE	.*/swagger-ui/.*
10110	OUTOFSCOPE	.*/swagger-ui/.*
