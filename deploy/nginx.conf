server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routes (/owners, /vets, ...) are handled in the browser, so any path
    # that is not a real file falls back to index.html. Without this, refreshing
    # or deep-linking to /owners returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
