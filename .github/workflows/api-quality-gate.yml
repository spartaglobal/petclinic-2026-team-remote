name: API quality gate
on:
  push:
    branches: [api-testing, main]
    paths:
      - 'tests/api/**'
      - 'spring-petclinic-rest/**'
      - '.github/workflows/api-quality-gate.yml'
  pull_request:
    paths:
      - 'tests/api/**'
      - 'spring-petclinic-rest/**'
      - '.github/workflows/api-quality-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-quality-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh service and API checks
        run: bash tests/api/gate.sh
      - name: Add API results to job summary
        if: always()
        run: |
          if [ -f tests/api/reports/summary.md ]; then
            cat tests/api/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve reports and startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-quality-evidence
          path: tests/api/reports/
          if-no-files-found: warn
