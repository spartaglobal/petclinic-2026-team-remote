# Example CI pipeline for the Petclinic hackathon.
#
#   backend ──► api-tests
#   frontend ─► e2e
#
# Skeleton only: each job sets up its toolchain and uploads reports.
# The commented-out steps are placeholders. Uncomment each one and give it
# a `run:` command (a step with only a name is invalid in GitHub Actions).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  backend:
    name: Backend – unit tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # - name: Make Maven wrapper executable
      # - name: Run tests
      # - name: Coverage report
      # - name: Coverage gate

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            spring-petclinic-rest/target/surefire-reports/
            spring-petclinic-rest/target/site/jacoco/
          if-no-files-found: ignore

  api-tests:
    name: Backend – Postman/Newman API tests
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version-file: spring-petclinic-angular/.nvmrc

      # - name: Build jar
      # - name: Start API
      # - name: Run Newman

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: |
            spring-petclinic-rest/src/test/postman/reports/
            spring-petclinic-rest/api.log
          if-no-files-found: ignore

  frontend:
    name: Frontend – lint, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: spring-petclinic-angular/.nvmrc
          cache: npm
          cache-dependency-path: spring-petclinic-angular/package-lock.json

      # - name: Install dependencies
      # - name: Lint
      # - name: Unit tests (Vitest)
      # - name: Build

  e2e:
    name: Frontend – Playwright E2E & accessibility
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: spring-petclinic-angular/.nvmrc
          cache: npm
          cache-dependency-path: spring-petclinic-angular/package-lock.json

      # - name: Install dependencies
      # - name: Install Playwright browsers
      # - name: Run E2E tests

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            spring-petclinic-angular/playwright-report/
            spring-petclinic-angular/test-results/
          if-no-files-found: ignore
