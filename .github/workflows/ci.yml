# Example CI pipeline for the Petclinic hackathon.
#
#   backend ──► api-tests
#   frontend ─► e2e
#
# Skeleton only: each job sets up its toolchain and uploads reports.
# The commented-out steps are placeholders. Uncomment each one and give it
# a `run:` command (a step with only a name is invalid in GitHub Actions).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  backend:
    name: Backend – unit tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: |
          cd spring-petclinic-rest
          chmod +x mvnw

      - name: Run tests
        run: |
          cd spring-petclinic-rest
          ./mvnw clean test

      - name: Coverage report # we use JaCoCo to generate the report.
        run: |
          cd spring-petclinic-rest
          ./mvnw jacoco:report
      # coverage gate is it required?

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            spring-petclinic-rest/target/surefire-reports/
            spring-petclinic-rest/target/site/jacoco/
          if-no-files-found: ignore

  api-tests:
    name: Backend – Postman/Newman API tests
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version-file: spring-petclinic-angular/.nvmrc

      - name: Build jar # takes the raw code and compresses into single jar file, and we skip tests since we know by this point they have passed
        run: |
          cd spring-petclinic-rest
          chmod +x mvnw
          ./mvnw clean package -DskipTests
      - name: Start API
        run: |
          cd spring-petclinic-rest
          nohup java -jar target/spring-petclinic-rest-*.jar > api.log 2>&1 &

      # Poll the health endpoint instead of a fixed sleep (max 2 minutes).
      - name: Wait for API to be healthy
        run: timeout 120 bash -c 'until curl -sf http://localhost:9966/petclinic/actuator/health; do sleep 2; done'
      - name: Run Newman # runs the postman-tests bash script.
        run: |
          cd spring-petclinic-rest
          bash postman-tests.sh 

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: |
            spring-petclinic-rest/src/test/postman/reports/
            spring-petclinic-rest/api.log
          if-no-files-found: ignore

  frontend:
    name: Frontend – lint, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: spring-petclinic-angular/.nvmrc
          cache: npm
          cache-dependency-path: spring-petclinic-angular/package-lock.json

      - name: Install dependencies # npm ci - ci stands for clean install
        run: |
          cd spring-petclinic-angular
          npm ci
      - name: Lint # checks for the formatting and syntax errors.
        run: |
          cd spring-petclinic-angular
          npm run lint 
      - name: Unit tests (Vitest) # runs frontend unit tests
        run: |
          cd spring-petclinic-angular
          npm run test:ci
      - name: Build # compiles the build
        run: |
          cd spring-petclinic-angular
          npx ng build

  e2e:
    name: Frontend – Playwright E2E & accessibility
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: spring-petclinic-angular/.nvmrc
          cache: npm
          cache-dependency-path: spring-petclinic-angular/package-lock.json

      # E2E journeys (register an owner and a pet) need the real API with seed data.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and start API
        run: |
          cd spring-petclinic-rest
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
          nohup java -jar target/spring-petclinic-rest-*.jar > api.log 2>&1 &

      - name: Wait for API to be healthy
        run: timeout 120 bash -c 'until curl -sf http://localhost:9966/petclinic/actuator/health; do sleep 2; done'

      - name: Install dependencies
        run: |
          cd spring-petclinic-angular
          npm ci
      - name: Install Playwright browsers # --with-deps also installs the Linux libraries Chromium needs
        run: |
          cd spring-petclinic-angular
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: |
          cd spring-petclinic-angular
          npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            spring-petclinic-angular/playwright-report/
            spring-petclinic-angular/test-results/
          if-no-files-found: ignore

  zap-scan:
    name: Security - ZAP Scan # automated security tool that looks for vulnerabilites and creates a report.
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Scan OUR code, not the public Docker Hub image.
      - name: Build and start API from this repo
        run: |
          cd spring-petclinic-rest
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
          nohup java -jar target/spring-petclinic-rest-*.jar > api.log 2>&1 &

      # Poll the health endpoint instead of a fixed sleep (max 2 minutes).
      - name: Wait for API to be healthy
        run: timeout 120 bash -c 'until curl -sf http://localhost:9966/petclinic/actuator/health; do sleep 2; done'

      # Uses the team's script and rules file (zap/zap-baseline.conf): passive baseline only.
      # Pinned ZAP version. Fails the job if a FAIL rule is hit; WARNs are reported only.
      - name: ZAP baseline scan
        env:
          IMAGE: docker.io/zaproxy/zap-stable:2.17.0
        run: bash spring-petclinic-rest/zap/run-zap-baseline.sh

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            spring-petclinic-rest/zap/reports/
            spring-petclinic-rest/api.log
          if-no-files-found: ignore

